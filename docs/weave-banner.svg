<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3a52"/>
      <stop offset="60%" style="stop-color:#0f4a68"/>
      <stop offset="100%" style="stop-color:#1a6b8a"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3aafc8;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#3aafc8;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#5bc4e8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#5bc4e8;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b8a"/>
      <stop offset="100%" style="stop-color:#0d3a52"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- onion rings pattern -->
    <radialGradient id="onionGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5bc4e8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3aafc8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Onion rings around center (decorative) -->
  <circle cx="600" cy="200" r="280" fill="none" stroke="#3aafc8" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="600" cy="200" r="230" fill="none" stroke="#3aafc8" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="600" cy="200" r="180" fill="none" stroke="#3aafc8" stroke-opacity="0.10" stroke-width="1.5"/>
  <circle cx="600" cy="200" r="130" fill="none" stroke="#3aafc8" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Glowing horizontal line through center -->
  <rect x="0" y="199" width="1200" height="2" fill="url(#glowLine)" opacity="0.4"/>

  <!-- ── LEFT NODE: Alice ── -->
  <g filter="url(#glow)">
    <circle cx="155" cy="200" r="54" fill="url(#nodeGrad)" stroke="#3aafc8" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="155" cy="200" r="44" fill="none" stroke="#5bc4e8" stroke-width="1" stroke-opacity="0.3"/>
    <!-- person icon -->
    <circle cx="155" cy="182" r="12" fill="#5bc4e8" opacity="0.9"/>
    <path d="M128 222 Q128 205 155 205 Q182 205 182 222" fill="#5bc4e8" opacity="0.9"/>
    <!-- onion badge -->
    <text x="155" y="248" text-anchor="middle" font-family="monospace" font-size="10" fill="#a8d4e4" opacity="0.8">🧅 .onion</text>
  </g>
  <text x="155" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#c8e8f4">alice.acme.weave.eth</text>
  <text x="155" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#7ab8cc">No IP exposed</text>

  <!-- ── RIGHT NODE: Bob ── -->
  <g filter="url(#glow)">
    <circle cx="1045" cy="200" r="54" fill="url(#nodeGrad)" stroke="#3aafc8" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="1045" cy="200" r="44" fill="none" stroke="#5bc4e8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="1045" cy="182" r="12" fill="#5bc4e8" opacity="0.9"/>
    <path d="M1018 222 Q1018 205 1045 205 Q1072 205 1072 222" fill="#5bc4e8" opacity="0.9"/>
    <text x="1045" y="248" text-anchor="middle" font-family="monospace" font-size="10" fill="#a8d4e4" opacity="0.8">🧅 .onion</text>
  </g>
  <text x="1045" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#c8e8f4">bob.acme.weave.eth</text>
  <text x="1045" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#7ab8cc">No IP exposed</text>

  <!-- ── ENCRYPTED TUNNEL (dashed pipe) ── -->
  <!-- Tunnel background -->
  <path d="M209 192 L991 192" stroke="#3aafc8" stroke-width="16" stroke-opacity="0.07" stroke-linecap="round"/>
  <path d="M209 208 L991 208" stroke="#3aafc8" stroke-width="16" stroke-opacity="0.07" stroke-linecap="round"/>
  <!-- Dashed lines -->
  <line x1="209" y1="196" x2="991" y2="196" stroke="#5bc4e8" stroke-width="1.5" stroke-dasharray="12,8" stroke-opacity="0.6"/>
  <line x1="209" y1="204" x2="991" y2="204" stroke="#5bc4e8" stroke-width="1.5" stroke-dasharray="12,8" stroke-dashoffset="10" stroke-opacity="0.6"/>
  <!-- Arrow right -->
  <path d="M975 193 L991 200 L975 207" fill="none" stroke="#5bc4e8" stroke-width="2" stroke-opacity="0.9"/>
  <!-- Arrow left (bidirectional) -->
  <path d="M225 193 L209 200 L225 207" fill="none" stroke="#5bc4e8" stroke-width="2" stroke-opacity="0.9"/>

  <!-- ── CENTER ENCRYPTION BADGE ── -->
  <g filter="url(#softglow)">
    <rect x="460" y="164" width="280" height="72" rx="10" fill="#0a2e42" stroke="#3aafc8" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="460" y="164" width="280" height="72" rx="10" fill="none" stroke="#5bc4e8" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>
  <text x="600" y="190" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#5bc4e8" filter="url(#glow)">Noise_XX · E2E Encrypted</text>
  <text x="600" y="208" text-anchor="middle" font-family="monospace" font-size="10" fill="#a8d4e4">X25519 key exchange · ChaCha20-Poly1305</text>
  <text x="600" y="224" text-anchor="middle" font-family="monospace" font-size="10" fill="#7ab8cc">No relay · No IP · No graph</text>

  <!-- ── TOP LABELS: crossed out platforms ── -->
  <!-- Crossed Slack -->
  <rect x="340" y="44" width="80" height="28" rx="4" fill="#1a2030" stroke="#e01e5a" stroke-width="1" stroke-opacity="0.5"/>
  <text x="380" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e01e5a" opacity="0.7" text-decoration="line-through">Slack</text>
  <!-- Crossed Teams -->
  <rect x="440" y="44" width="80" height="28" rx="4" fill="#1a2030" stroke="#e01e5a" stroke-width="1" stroke-opacity="0.5"/>
  <text x="480" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e01e5a" opacity="0.7" text-decoration="line-through">Teams</text>
  <!-- Crossed Discord -->
  <rect x="540" y="44" width="80" height="28" rx="4" fill="#1a2030" stroke="#e01e5a" stroke-width="1" stroke-opacity="0.5"/>
  <text x="580" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e01e5a" opacity="0.7" text-decoration="line-through">Discord</text>
  <!-- Crossed Telegram -->
  <rect x="640" y="44" width="90" height="28" rx="4" fill="#1a2030" stroke="#e01e5a" stroke-width="1" stroke-opacity="0.5"/>
  <text x="685" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e01e5a" opacity="0.7" text-decoration="line-through">Telegram</text>
  <!-- "all leak" label -->
  <text x="512" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e05a5a" opacity="0.6" font-style="italic">all leak your metadata ↑</text>

  <!-- ── ETHEREUM BADGE (bottom center) ── -->
  <g>
    <rect x="510" y="308" width="180" height="40" rx="6" fill="#0a2030" stroke="#3aafc8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="600" y="325" text-anchor="middle" font-family="monospace" font-size="10" fill="#7ab8cc">⛓ Identity on Ethereum</text>
    <text x="600" y="340" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a8aa0">ENSv2 · EAC bitmap · Arkiv</text>
  </g>

  <!-- ── MAIN TITLE ── -->
  <text x="600" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-1" filter="url(#glow)">Private Comms. Zero Servers.</text>
  <text x="600" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#a8d4e4" letter-spacing="0.5">weave.davinciin.xyz</text>

  <!-- Subtle bottom border glow -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#glowLine)" opacity="0.5"/>
</svg>
